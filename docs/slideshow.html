<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meta-Innovation Harness — Pitch Deck (100 slides)</title>
<meta name="description" content="Auto-advancing 100-slide pitch deck for the Meta-Innovation Harness: blanking + leaking cross-pollination, Group Genius, TSM-CI, six workflows, and the meta / meta-meta layers." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/theme/black.css" id="theme" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" />
<style>
  :root{
    --void:#080b10; --void2:#0d1117; --void3:#111820; --panel:#131b25; --panel2:#16202c;
    --border:#1e2d3d; --border-hi:#2a4060;
    --amber:#f5a623; --amber-dim:#c07f10; --cyan:#00d4ff; --cyan-dim:#0099bb;
    --ice:#e8f4f8; --bone:#c8bfaa; --mist:#7a8fa0; --text:#d4dde6; --text-dim:#8899aa;
    --success:#22c55e; --pink:#ff6b9d; --blue:#8b9cff;
    --fd:'Syne',sans-serif; --fm:'IBM Plex Mono',monospace;
  }
  html,body{background:var(--void);}
  .reveal{font-family:var(--fm);color:var(--text);font-size:30px;}
  .reveal .slides{text-align:left;}
  .reveal h1,.reveal h2,.reveal h3{font-family:var(--fd);color:var(--ice);font-weight:800;
    text-transform:none;letter-spacing:-0.01em;line-height:1.04;margin:0 0 .3em;}
  .reveal h1{font-size:1.9em;} .reveal h2{font-size:1.35em;} .reveal h3{font-size:1.0em;}
  .reveal p,.reveal li{font-family:var(--fm);color:var(--text);line-height:1.45;}
  .reveal a{color:var(--cyan);} .reveal strong{color:var(--ice);}
  .reveal em{color:var(--amber);font-style:normal;}
  .reveal section{padding:0;}

  /* top hairline */
  .reveal .slides section::before{content:'';position:absolute;top:-6px;left:-6px;right:-6px;height:5px;
    background:linear-gradient(90deg,var(--amber) 0%,var(--amber) 55%,var(--cyan) 55%,var(--cyan) 100%);
    opacity:.9;border-radius:2px;}

  .eyebrow{font-family:var(--fm);font-size:.5em;letter-spacing:.22em;text-transform:uppercase;
    color:var(--cyan);margin-bottom:.35em;display:block;}
  .lead{font-size:.62em;color:var(--text);line-height:1.5;max-width:24em;}
  .muted{color:var(--text-dim);} .amber{color:var(--amber);} .cyan{color:var(--cyan);}
  .ice{color:var(--ice);} .small{font-size:.5em;} .tiny{font-size:.42em;letter-spacing:.06em;}
  .center{text-align:center;}

  /* cards / grids */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:.55em .7em;position:relative;overflow:hidden;}
  .card.v2{background:var(--void2);} .card .acc{position:absolute;left:0;top:0;bottom:0;width:6px;}
  .grid{display:grid;gap:.5em;margin-top:.3em;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:.6em;align-items:start;}
  .ttl{font-family:var(--fd);font-weight:700;color:var(--ice);font-size:.62em;}
  .desc{font-size:.46em;color:var(--text);line-height:1.35;margin-top:.15em;}
  .label{font-family:var(--fm);font-size:.4em;letter-spacing:.2em;text-transform:uppercase;}
  ul.clean{list-style:none;margin:.2em 0;padding:0;}
  ul.clean li{font-size:.55em;padding:.12em 0 .12em 1em;position:relative;line-height:1.4;}
  ul.clean li::before{content:'▸';position:absolute;left:0;color:var(--amber);}
  .bignum{font-family:var(--fd);font-weight:800;font-size:1.5em;line-height:1;}
  .stat{font-family:var(--fd);font-weight:800;font-size:2.0em;line-height:1;color:var(--amber);}
  .statlbl{font-family:var(--fm);font-size:.4em;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);}
  .pill{display:inline-block;font-size:.42em;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--border-hi);border-radius:20px;padding:.25em .8em;color:var(--cyan);margin-bottom:.6em;}
  .quote{font-family:var(--fd);font-weight:700;color:var(--amber);font-size:1.0em;line-height:1.15;}
  .mono{font-family:var(--fm);}
  pre.tree{background:var(--void2);border:1px solid var(--border);border-radius:8px;
    padding:.6em .8em;font-size:.42em;line-height:1.5;color:var(--text);box-shadow:none;width:auto;}
  pre.tree .d{color:var(--cyan);} pre.tree .f{color:var(--amber);}

  /* divider slide */
  .divider{position:relative;height:100%;}
  .divider .actbig{position:absolute;right:-.1em;top:.0em;font-family:var(--fd);font-weight:800;
    font-size:8em;color:var(--void3);line-height:1;z-index:0;}
  .divider .inner{position:relative;z-index:1;border-top:3px solid var(--amber);
    border-bottom:3px solid var(--cyan);padding:1em 0;margin-top:1.2em;}
  .divider .act{font-family:var(--fm);letter-spacing:.3em;color:var(--cyan);font-size:.5em;text-transform:uppercase;}
  .divider h1{font-size:2.1em;margin:.15em 0;}
  .divider .sub{font-size:.55em;color:var(--text-dim);max-width:26em;margin-top:.5em;line-height:1.5;}

  /* title slide */
  .title h1{font-size:3.0em;line-height:.92;margin:.1em 0;}
  .title .tag{font-family:var(--fd);font-weight:700;color:var(--text);font-size:.72em;margin-top:.3em;}
  .title .strip{display:flex;gap:1.4em;margin-top:.7em;}
  .title .strip .stat{font-size:1.4em;}

  /* slide number / footer */
  .reveal .slide-number{font-family:var(--fm);background:transparent;color:var(--amber);font-size:14px;right:18px;bottom:14px;}
  .footer{position:fixed;left:20px;bottom:14px;font-family:var(--fm);font-size:11px;
    letter-spacing:2px;color:var(--text-dim);z-index:30;}
  .actfoot{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;font-family:var(--fm);
    font-size:11px;letter-spacing:2px;color:var(--mist);z-index:30;}

  /* progress accent */
  .reveal .progress{color:var(--amber);height:4px;}
  .reveal .controls{color:var(--cyan);}

  /* autoplay toggle button */
  #playbtn{position:fixed;top:14px;right:16px;z-index:40;font-family:var(--fm);font-size:12px;
    letter-spacing:1px;background:var(--panel);color:var(--amber);border:1px solid var(--border-hi);
    border-radius:20px;padding:.4em .9em;cursor:pointer;text-transform:uppercase;}
  #playbtn:hover{border-color:var(--amber);color:var(--ice);}
  .flow{display:flex;align-items:center;gap:.3em;flex-wrap:wrap;}
  .flow .node{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.35em .5em;
    font-size:.42em;text-align:center;min-width:5.5em;} .flow .arr{color:var(--amber);font-size:.6em;}
  .map{font-size:.5em;line-height:1.7;} .map b{color:var(--amber);font-family:var(--fd);}
  .map .ar{color:var(--text);}
</style>
</head>
<body>
<button id="playbtn" aria-label="Toggle autoplay">⏸ Auto</button>
<div class="footer">META-INNOVATION HARNESS</div>
<div class="actfoot" id="actfoot"></div>

<div class="reveal"><div class="slides" id="slides"></div></div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
<script>
/* ----- color tokens for JS ----- */
const K={amber:'var(--amber)',cyan:'var(--cyan)',ice:'var(--ice)',blue:'var(--blue)',pink:'var(--pink)',
  success:'var(--success)',text:'var(--text)',red:'#ff6b6b'};
const EX={claude:K.amber,chatgpt:K.cyan,gemini:K.blue,grok:K.pink};

/* helper builders -> HTML strings */
const card=(acc,inner,cls='')=>`<div class="card ${cls}"><span class="acc" style="background:${acc}"></span>${inner}</div>`;
const eb=t=>`<span class="eyebrow">${t}</span>`;
function slide(act,html,opts={}){
  return `<section data-act="${act}" ${opts.bg?`data-background-color="${opts.bg}"`:''}>${html}</section>`;
}
function content(eyebrow,title,body,opts={}){
  return slide(opts.act||'', `${eb(eyebrow)}<h2 style="${opts.ts?`font-size:${opts.ts}`:''}">${title}</h2>${body}`, opts);
}
function divider(act,title,sub){
  return slide(act, `<div class="divider"><div class="actbig">${act.replace('ACT ','')}</div>
    <div class="inner"><div class="act">${act}</div><h1>${title}</h1><div class="sub">${sub}</div></div></div>`);
}

/* ============ SLIDE DATA (mirrors the 100-slide PPTX) ============ */
const S=[];

/* --- Act 0 --- */
S.push(slide('TITLE',`<div class="title">
  <span class="eyebrow">v1.0 · MIT License · dlmastery · Claude Code Skill Suite</span>
  <h1>Meta-Innovation<br><em>Harness</em></h1>
  <div class="tag">Four frontier AIs.  Six innovation workflows.  One orchestrating mind.</div>
  <p class="lead" style="margin-top:.5em">A novel <strong>blanking + leaking cross-pollination</strong> method that engineers Group Genius on any research goal.</p>
  <div class="strip">
    <div><div class="stat">4</div><div class="statlbl">Frontier AIs</div></div>
    <div><div class="stat" style="color:${K.cyan}">6</div><div class="statlbl">Workflows</div></div>
    <div><div class="stat">8</div><div class="statlbl">Skills</div></div>
    <div><div class="stat" style="color:${K.cyan}">∞</div><div class="statlbl">Research goals</div></div>
  </div></div>`));

S.push(content('Operating Stance · P0','The Persona',
  `<div class="col"><div>${card(K.amber,`<div class="quote">“Triple-PhD MIT Genius — Elite of the Elite Researcher, Best of the Best on Planet Earth.”</div>
   <p class="small" style="margin-top:.5em">Drawing wisdom from ALL fields known to mankind — fusing them into breakthroughs no single-discipline mind could reach.</p>
   <div class="label cyan" style="margin-top:.5em">Not vanity — an epistemic contract</div>
   <ul class="clean"><li>Sets the quality floor for every prompt</li><li>Widens disciplinary reference</li><li>Courage for genuinely radical ideas</li><li>Ruthless self-critique</li></ul>`,'v2')}</div>
   <div>${card(K.cyan,`<div class="label amber">Applies to</div>
   <ul class="clean"><li class="ice"><strong>The Orchestrator (Claude Code)</strong></li><li>Claude · expert</li><li>ChatGPT · expert</li><li>Gemini · expert</li><li>Grok · expert</li></ul>
   <p class="tiny muted" style="margin-top:.4em">Stated verbatim atop every expert invocation.</p>`)}</div></div>`,
  {act:'ACT 0 · TITLE'}));

S.push(content('The One-Line Thesis','Breakthroughs live at the intersections.',
  `<p class="lead" style="max-width:40em;font-size:.58em">Real breakthroughs emerge at disciplinary intersections. No single LLM — however capable — can simultaneously hold a biologist's intuition, a physicist's rigor, a social scientist's measurement discipline, and a world-modeler's constraint-stripping creativity.</p>
   ${card(K.cyan,`<div class="quote" style="font-size:.9em">The TSM-CI and Group Genius literature prove structured cross-pollination among diverse experts outperforms any individual. This harness encodes that proof as an algorithm.</div>`,'v2')}`,
  {act:'ACT 0 · TITLE',ts:'1.15em'}));

/* --- Act I --- */
const A1='ACT I · THE PROBLEM';
S.push(divider('ACT I','The Problem','Why single-LLM and single-genius research stalls — and the six coupled frontier questions the field cannot yet answer.'));
S.push(content('First Premise','The lone-genius myth is false.',
  `<div class="quote" style="font-size:1.0em">“Creativity is almost always emergent from interaction.”</div>
   <p class="lead" style="font-size:.55em;margin-top:.4em">Keith Sawyer studied jazz ensembles, improv theater, and innovation labs. Breakthroughs come from a series of sparks — never a single flash.</p>
   ${card(K.cyan,`<p class="small ice">If genius is interactional, the way to amplify it is to engineer the interaction — not to wait for a bigger lone mind.</p>`,'v2')}`,{act:A1}));
S.push(content('The Single-Model Ceiling','One model averages.',
  `<p class="lead" style="max-width:42em;font-size:.55em">Each frontier model carries training biases, stylistic priors, and epistemic defaults that constrain the solution space. Not bugs — irreducible features.</p>
   <div class="grid g4">${[['Claude','philosophical nuance · biological analogy',EX.claude],['GPT','quantitative mechanism · engineering',EX.chatgpt],['Gemini','empirical validation · social context',EX.gemini],['Grok','contrarianism · constraint-stripping',EX.grok]].map(t=>card(t[2],`<div class="ttl" style="color:${t[2]}">${t[0]}</div><div class="desc">${t[1]}</div>`)).join('')}</div>
   <p class="small amber" style="margin-top:.4em">The insight: EXPLOIT these differences rather than eliminate them.</p>`,{act:A1}));
S.push(content('The Anchoring Trap','Iterating on your own answer shrinks the search.',
  `<div class="col"><div><p class="small">Tversky &amp; Kahneman (1974): first impressions dominate later reasoning — even when told the initial value is random.</p>
   ${[5.2,4.2,3.2,2.2].map((w,i)=>`<div class="card" style="width:${w}em;margin:.2em 0;padding:.25em .5em"><span class="small" style="color:${i===3?K.mist:K.text}">Round ${i+1} — alternatives ▾</span></div>`).join('')}</div>
   <div>${card(K.amber,`<p class="small ice">Ask one model to iterate on its own prior answer and it anchors heavily — the space of alternatives collapses round by round.</p>`,'v2')}</div></div>`,{act:A1,ts:'1.05em'}));
S.push(content('Structural, Not Fixable','No single mind suffices for frontier research.',
  `<p class="lead" style="max-width:42em;font-size:.56em">Deep expertise in one domain comes at the cost of breadth across others. A structural feature of how knowledge is organised — not a deficiency a bigger model removes.</p>
   <div class="grid g2">${['Quantum decoherence from first principles','How biases emerge from social structure','How evolution optimises under constraint','Imagining radically alternative physics'].map(t=>card(K.cyan,`<span class="small">${t}</span>`)).join('')}</div>
   <p class="tiny amber" style="margin-top:.3em">…rarely live inside one head. Or one model.</p>`,{act:A1,ts:'1.05em'}));
S.push(content('The Source Material','The DeepMind / Gemini talk.',
  `<p class="small">A sit-down with four leaders on Gemini's origin, unified models, distillation, evaluation, and the 2027 research horizon.</p>
   <div class="grid g2">${[['Jeff Dean','Computing infrastructure & scale'],['Koray Kavukcuoglu','Research direction & architecture'],['Noam Shazeer','Architecture · Transformer co-inventor'],['Oriol Vinyals','Agents & multimodal systems']].map(t=>card(K.cyan,`<div class="ttl">${t[0]}</div><div class="desc">${t[1]}</div>`)).join('')}</div>
   <p class="tiny amber" style="margin-top:.3em">Long shared history was named the secret ingredient — analogous to transactive memory.</p>`,{act:A1}));
S.push(content('Where the Frontier Is','Solved engineering vs. the live agenda.',
  `<div class="col"><div>${card(K.success,`<div class="label" style="color:${K.success}">Framed as solved</div><ul class="clean"><li>Unification — the “twins” merger</li><li>Distillation — Flash beats prior Pro</li><li>Product feedback loops</li><li>Long-term team trust (TMS)</li></ul>`,'v2')}</div>
   <div>${card(K.amber,`<div class="label amber">Framed as open · 2027 agenda</div><ul class="clean"><li>Self-improvement loops</li><li>Long-horizon agency</li><li>Proper evaluation</li><li>Human-like efficiency</li><li>Deep world modeling</li><li>One-model → many-products</li></ul>`,'v2')}</div></div>`,{act:A1,ts:'1.05em'}));
S.push(content('The Open Agenda','Six frontier questions.',
  `<div class="grid g3">${[['Q1','Self-learning / organic continuous learning',EX.claude],['Q2','Reliable long-duration autonomous agents',EX.chatgpt],['Q3','Evaluation beyond benchmarks',EX.gemini],['Q4','Closing the human-AI efficiency gap',EX.grok],['Q5','World modeling / physical dynamics (Omni)',K.cyan],['Q6','One model → thousands of products',K.amber]].map(q=>card(q[2],`<div class="bignum" style="color:${q[2]};font-size:1.1em">${q[0]}</div><div class="desc" style="font-size:.5em">${q[1]}</div>`)).join('')}</div>
   <p class="tiny amber" style="margin-top:.3em">Foundational, coupled open challenges betting the 2027 trajectory.</p>`,{act:A1}));

const qData=[
 ['Q1','Self-learning / organic continuous learning.','“We haven\'t achieved a truly organic or continuously learning architecture yet.” The vision: models that use their own agentic capabilities as research assistants — proposing improvements, running experiments on themselves, helping design their successor.','The big 2027 leap — unlocking vast remaining capacity without simply adding scale.',EX.claude],
 ['Q2','Reliable long-duration autonomous agents.','Directly named an ongoing challenge. They want agentic persistence — agents coherent and useful over days, not minutes. Tied to infrastructure; essential before agents can contribute to self-research.','The reliability gap currently blocks the self-learning vision from being realized.',EX.chatgpt],
 ['Q3','Evaluation beyond benchmarks.','Repeatedly emphasized as a critical hurdle. Internal benchmarks no longer suffice; the ultimate test must be real-world user feedback and product usage.','Turn messy, high-dimensional, live signal into a rigorous, scalable evaluation system.',EX.gemini],
 ['Q4','Closing the human-AI efficiency gap.','Humans learn with far less data and compute. Algorithmic breakthroughs in sample efficiency — and more “organic” architectures — may beat raw scaling.','One of the clearest paths to unlocking more intelligence from today\'s hardware.',EX.grok],
 ['Q5','World modeling / physical dynamics.','The shift from text/image/video to models that natively understand physics, causality, and “moving atoms” — the Gemini Omni direction.','Necessary for agents that act reliably in the physical or long-horizon digital world.',K.cyan],
];
qData.forEach(q=>S.push(content('Frontier Question · '+q[0],q[1],
  `<div class="col"><div>${card(q[4],`<p class="small">${q[2]}</p>`,'v2')}</div>
   <div>${card(q[4],`<div class="label" style="color:${q[4]}">Why it matters</div><p class="small ice" style="margin-top:.3em">${q[3]}</p>`)}</div></div>`,{act:A1,ts:'1.0em'})));
S.push(content('Frontier Question · Q6','One model → thousands of products.',
  `${card(K.amber,`<p class="small">Consensus on “one model — countless specialized outlets,” raising how to design interfaces, distillation/specialization layers, and interaction paradigms so the single model feels excellent everywhere — without fragmentation creeping back in.</p>`,'v2')}
   ${card(K.cyan,`<div class="label cyan">Why the six are coupled</div><p class="small ice" style="margin-top:.2em">Self-learning needs reliable agents (Q1↔Q2); both need new evaluation (Q3); efficiency reshapes all three (Q4); world models ground agency (Q5); productization is how it ships (Q6). Answering one gives context for the others — the interdependence the harness exploits.</p>`)}`,
  {act:A1,ts:'1.0em'}));

/* --- Act II --- */
const A2='ACT II · THE INSIGHT';
S.push(divider('ACT II','The Insight','Group Genius, Group Flow, and the Transactive Systems Model of Collective Intelligence — the science of why diverse teams out-think any individual.'));
S.push(content('Keith Sawyer · 2007','Group Genius.',
  `<p class="lead" style="max-width:40em;font-size:.6em">The highest-quality creative work — in science, art, and innovation — emerges from structured improvisation between diverse experts genuinely building on one another.</p>
   ${card(K.amber,`<div class="quote">Genius is not individual. It is interactional.</div>`,'v2')}
   <p class="tiny muted" style="margin-top:.4em">The harness encodes this as a protocol: fixed lenses, blanking discipline, rotation rules — forcing genuine cross-pollination, not polite sequential monologue.</p>`,{act:A2}));
S.push(content('The Peak Collective State','Group Flow.',
  `<p class="small">When a team feels “in sync,” time distorts and ideas flow improvisationally. Sawyer's ten conditions include:</p>
   <div class="grid g4">${['Clear but open goals','Autonomy','Potential for failure','Spontaneous communication','Close listening','Equal participation','Blending of egos','Familiarity & trust'].map(c=>`<div class="card" style="font-size:.5em"><span class="ice">${c}</span></div>`).join('')}</div>
   <p class="tiny amber" style="margin-top:.3em">Each workflow re-creates a different subset of these conditions on purpose.</p>`,{act:A2}));
S.push(content('Literature-Backed','Four deep mechanisms.',
  `<div class="grid g2">${[['01','Idea sparks + recombination','“Yes-and.” Bell Labs met “almost on the spur of the moment” daily.',EX.claude],['02','Attention & focus dynamics','Concentration + close listening + equal participation = shared joint attention.',EX.chatgpt],['03','Added context / cross-pollination','Each genius reframes the problem — exactly how blanking+leaking works.',EX.gemini],['04','Familiarity + trust + risk','Long shared history supplies tacit knowledge — sync without groupthink.',EX.grok]].map(t=>card(t[3],`<div class="flow"><span class="bignum" style="color:${t[3]};font-size:.9em">${t[0]}</span><span class="ttl">${t[1]}</span></div><div class="desc">${t[2]}</div>`)).join('')}</div>`,{act:A2}));
S.push(content('Woolley · Gupta et al.','TSM-CI — the modern framework.',
  `<p class="small" style="max-width:42em">The Transactive Systems Model of Collective Intelligence — the most precise modern account of group IQ, tested on 476 open-source teams. Three interlocking transactive systems.</p>
   <div class="grid g3">${[['TMS','Transactive Memory','who knows what',EX.claude],['TAS','Transactive Attention','where focus goes',K.cyan],['TRS','Transactive Reasoning','joint sense-making',K.amber]].map(t=>card(t[3],`<div class="bignum" style="color:${t[3]}">${t[0]}</div><div class="ttl">${t[1]}</div><div class="desc"><em>${t[2]}</em></div>`,'v2')).join('')}</div>`,{act:A2,ts:'1.05em'}));
const tsData=[['TMS','Transactive Memory.','Everyone knows “who knows what.” The DeepMind team\'s long shared history was a perfect TMS.','LEAKING builds it — every AI sees the evolving group knowledge across all other questions.',EX.claude],
 ['TAS','Transactive Attention.','The group collectively directs and sustains focus on the most promising threads.','RANDOM BLANKING forces re-allocation — the AI must re-engage the focal question entirely fresh.',K.cyan],
 ['TRS','Transactive Reasoning.','Joint sense-making and error-correction, where one idea is immediately reframed by others.','The CLEAN-SLATE RE-ASK + polymath prompt enforces fresh reasoning informed by the collective.',K.amber]];
tsData.forEach(t=>S.push(content('Transactive System · '+t[0],t[1],
  `<div class="col"><div>${card(t[4],`<div class="label" style="color:${t[4]}">In human groups</div><p class="small" style="margin-top:.2em">${t[2]}</p>`,'v2')}</div>
   <div>${card(K.amber,`<div class="label amber">In the AI protocol</div><p class="small ice" style="margin-top:.2em">${t[3]}</p>`,'v2')}</div></div>`,{act:A2,ts:'1.05em'})));

/* ---- reveal init ---- */
const deck = new Reveal({
  width: 1280, height: 720, margin: 0.055, minScale:0.2, maxScale:1.6,
  hash:true, controls:true, progress:true, slideNumber:'c/t', center:true,
  transition:'fade', transitionSpeed:'default', backgroundTransition:'fade',
  autoSlide: 6000, loop:true, autoSlideStoppable:true,
});
deck.initialize().then(()=>{ updateAct(); });

/* footer act label */
function updateAct(){
  const cur = deck.getCurrentSlide();
  const act = cur && cur.getAttribute('data-act');
  document.getElementById('actfoot').textContent = act || '';
}
deck.on('slidechanged', updateAct);

/* play/pause toggle */
const btn=document.getElementById('playbtn');
let playing=true;
function setBtn(){ btn.textContent = playing ? '⏸ Auto' : '▶ Play'; }
btn.addEventListener('click',()=>{
  if(playing){ deck.configure({autoSlide:0}); playing=false; }
  else{ deck.configure({autoSlide:6000}); deck.next(); playing=true; }
  setBtn();
});
deck.on('autoslidepaused',()=>{ playing=false; setBtn(); });
deck.on('autoslideresumed',()=>{ playing=true; setBtn(); });
